<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>관리자 - 아신대학교 규정정보시스템</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <h1>아신대학교 규정정보시스템 <span class="admin-badge">관리자</span></h1>
    <nav class="top-nav">
      <a href="index.html">공개 화면으로</a>
      <a href="#" id="logoutLink" style="display:none">로그아웃</a>
    </nav>
  </header>

  <main class="admin-main">
    <section id="loginSection" class="login-panel">
      <div class="admin-panel">
        <h2>관리자 로그인</h2>
        <div class="admin-form-row">
          <input type="password" id="passwordInput" placeholder="비밀번호">
          <button id="loginBtn">로그인</button>
        </div>
        <p id="loginError" class="admin-error"></p>
      </div>
    </section>

    <section id="editorSection" class="admin-shell" style="display:none">
      <div class="admin-pane admin-reg-panel">
        <div class="admin-pane-head">
          <h2>규정 선택</h2>
          <input type="text" id="regFilter" placeholder="규정명으로 필터">
        </div>
        <ul id="regList" class="admin-list"></ul>
      </div>

      <div class="admin-pane admin-article-panel" id="articlePanel" style="display:none">
        <div class="admin-pane-head">
          <h2 id="articlePanelTitle"></h2>
        </div>
        <ul id="articleOutline" class="admin-list"></ul>
      </div>

      <div class="admin-pane admin-edit-panel" id="editPanel" style="display:none">
        <div class="admin-pane-head">
          <h2 id="editArticleHead"></h2>
        </div>
        <div class="admin-edit-body">
          <textarea id="editBody"></textarea>
          <div class="admin-form-row">
            <label>개정일자 <input type="date" id="revisedAt"></label>
            <label class="grow">개정 사유/요약 <input type="text" id="revisedSummary" placeholder="예: 제5조 위원 정수 변경"></label>
            <button id="saveBtn">저장</button>
          </div>
          <p id="saveResult" class="admin-result"></p>
        </div>
      </div>

      <div class="admin-pane admin-empty-hint" id="emptyHint">
        <p id="emptyHintText">왼쪽에서 규정을 선택하세요.</p>
      </div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
