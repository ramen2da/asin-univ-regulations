<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아신대학교 규정관리시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <div class="masthead-id">
        <div class="eyebrow"><span class="seal-dot"></span>OFFICIAL REGULATIONS · ACTS</div>
        <h1 id="homeLink" title="홈으로 이동">아신대학교 규정관리시스템</h1>
      </div>
      <nav class="top-nav">
        <a href="#" id="navRecent">최근 제·개정</a>
        <a href="#" id="navRevisions">개정내역</a>
        <a href="#" id="navForms">서식 정보</a>
        <a href="admin.html">관리자</a>
      </nav>
      <img class="header-logo" src="img/acts-logo.png" alt="ACTS 아신대학교">
    </div>
    <div class="search-hero">
      <div class="search-bar">
        <select id="searchScope">
          <option value="title">규정명</option>
          <option value="body">규정내용</option>
        </select>
        <div class="search-field">
          <input type="text" id="searchInput" placeholder="규정명 또는 조문 내용으로 찾아보기">
        </div>
        <button id="searchBtn">검색</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav id="tree" class="tree"></nav>
    <button id="treeTab" class="panel-tab panel-tab-left" title="분류 메뉴 접기/펴기" aria-label="분류 메뉴 접기/펴기">&#8249;</button>
    <main id="content" class="content">
      <div id="contentHeader" class="content-header"></div>
      <div id="contentBody" class="content-body">
        <p class="placeholder">왼쪽에서 분류를 선택하거나 검색어를 입력하세요.</p>
      </div>
    </main>
    <button id="sidebarTab" class="panel-tab panel-tab-right" title="조별목록 접기/펴기" aria-label="조별목록 접기/펴기" hidden>&#8250;</button>
    <aside id="detailSidebar" class="detail-sidebar"></aside>
    <div id="panelBackdrop" class="panel-backdrop"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
